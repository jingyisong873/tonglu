name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run example
      - run: npm audit --audit-level=high
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish a new package version after verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(node -e 'const v=JSON.parse(require("fs").readFileSync("package.json","utf8")).version;if(!/^\d+\.\d+\.\d+$/.test(v))process.exit(1);process.stdout.write("v"+v)')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          notes="docs/releases/$tag.md"
          test -s "$notes"
          git archive --format=zip --prefix=tonglu/ -o "tonglu-$tag.zip" "$GITHUB_SHA"
          git archive --format=tar.gz --prefix=tonglu/ -o "tonglu-$tag.tar.gz" "$GITHUB_SHA"
          sha256sum "tonglu-$tag.zip" "tonglu-$tag.tar.gz" > SHA256SUMS
          gh release create "$tag" "tonglu-$tag.zip" "tonglu-$tag.tar.gz" SHA256SUMS \
            --target "$GITHUB_SHA" --title "Tonglu $tag" --notes-file "$notes"
